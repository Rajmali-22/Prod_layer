<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interview Q&A</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: rgba(255, 255, 255, 0.95);
      overflow: hidden;
      user-select: none;
    }
    .panel {
      width: 100%;
      height: 100vh;
      background: rgba(16, 16, 18, 0.92);
      backdrop-filter: blur(50px) saturate(200%);
      -webkit-backdrop-filter: blur(50px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .titlebar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }
    .titlebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: rgba(100, 180, 255, 0.9);
      text-transform: uppercase;
    }
    .titlebar-close {
      -webkit-app-region: no-drag;
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
    }
    .titlebar-close:hover {
      background: rgba(255, 60, 60, 0.3);
      color: rgba(255, 255, 255, 0.9);
    }
    .status-bar {
      padding: 8px 12px;
      font-size: 11px;
      color: rgba(100, 200, 150, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(150, 150, 150, 0.6);
    }
    .status-dot.listening { background: rgba(100, 200, 150, 0.9); animation: pulse 1.5s ease-in-out infinite; }
    .status-dot.transcribing { background: rgba(255, 200, 80, 0.9); animation: pulse 1s ease-in-out infinite; }
    .status-dot.answering { background: rgba(100, 150, 255, 0.9); animation: pulse 1s ease-in-out infinite; }
    .status-dot.error { background: rgba(255, 100, 100, 0.9); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .question-block {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      max-height: 120px;
      overflow-y: auto;
    }
    .question-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 4px;
    }
    .question-text {
      font-size: 13px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.75);
      font-style: italic;
    }
    .answer-scroll { flex: 1; overflow-y: auto; padding: 12px; }
    .answer-body {
      font-size: 14px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.92);
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .streaming-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: rgba(100, 180, 255, 0.9);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .hint-bar {
      padding: 6px 12px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
      text-align: center;
    }
    .error-box {
      color: rgba(255, 120, 120, 0.9);
      padding: 10px;
      background: rgba(255, 80, 80, 0.08);
      border-radius: 8px;
      border-left: 3px solid rgba(255, 100, 100, 0.4);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="titlebar">
      <span class="titlebar-title">Interview Q&A</span>
      <button class="titlebar-close" id="close-btn" title="Close">&times;</button>
    </div>
    <div class="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>
    <div class="question-block" id="question-block" style="display:none;">
      <div class="question-label">Question</div>
      <div class="question-text" id="question-text"></div>
    </div>
    <div class="answer-scroll">
      <div class="answer-body" id="answer-body">
        <span style="color:rgba(255,255,255,0.25);font-size:13px;">Answers appear here in real time.</span>
      </div>
    </div>
    <div class="hint-bar">Ctrl+Shift+I toggle · Ctrl+Alt+I answer now</div>
  </div>
  <script src="index.js"></script>
</body>
</html>
